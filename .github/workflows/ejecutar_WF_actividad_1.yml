name: Ejecutando WF tareas

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ejecutar-semana-1-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: Limpiar datos y reportes generados
        run: |
          mkdir -p src/sincronicas/datos src/sincronicas/reportes
          find src/sincronicas/datos -mindepth 1 -delete
          find src/sincronicas/reportes -mindepth 1 -delete

      - name: Ejecutar Entrega_1.ipynb
        working-directory: src/sincronicas
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            Entrega_1.ipynb

      - name: Ejecutar Clasificacion.ipynb
        working-directory: src/sincronicas
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            Clasificacion.ipynb

      - name: Ejecutar Regresion_Lineal.ipynb
        working-directory: src/sincronicas
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            Regresion_Lineal.ipynb

      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "74476816+JuanDavidRamirezGarcia@users.noreply.github.com"
          git add src/sincronicas/datos src/sincronicas/reportes src/sincronicas/Entrega_1.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: ejecutar tareas de clasificacion, regresion y entrega 1 [skip ci]"
          git push origin HEAD:main